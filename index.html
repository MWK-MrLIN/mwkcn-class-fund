  <script>
    (function initMwkcnOneSignal() {
      const appFrame = document.getElementById('appFrame');
      const APP_ID = 'b9217e22-0f2e-41bc-821a-df4de8fd7035';
      const WRAPPER_ORIGIN = window.location.origin;
      const allowedFrameOrigins = new Set([
        'https://script.google.com',
        'https://script.googleusercontent.com'
      ]);
      let currentStudentId = '';
      let oneSignalReady = false;
      let notificationBusy = false;
      function cleanStudentId(value) {
        const normalized = String(value == null ? '' : value).trim();
        return /^[A-Za-z0-9_-]{3,64}$/.test(normalized) ? normalized : '';
      }
      function browserNotificationPermission() {
        return typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
      }
      function oneSignalIsEnabled() {
        try {
          var subscription = window.OneSignal && window.OneSignal.User && window.OneSignal.User.PushSubscription;
          return Boolean(subscription && subscription.optedIn === true);
        } catch (error) {
          return false;
        }
      }
      function waitForNotificationState(expected, timeoutMs) {
        var startedAt = Date.now();
        return new Promise(function (resolve) {
          function check() {
            var enabled = oneSignalIsEnabled();
            if (enabled === expected || Date.now() - startedAt >= timeoutMs) {
              resolve(enabled);
              return;
            }
            window.setTimeout(check, 250);
          }
          check();
        });
      }
      async function sendActivationTestNotification() {
        if (browserNotificationPermission() !== 'granted') return false;
        var notificationOptions = {
          body: 'เปิดใช้งานการแจ้งเตือนแล้ว',
          icon: './icons/icon-192.png',
          tag: 'mwkcn-notification-enabled',
          renotify: true
        };
        try {
          if ('serviceWorker' in navigator) {
            var registration = await navigator.serviceWorker.ready;
            if (registration && typeof registration.showNotification === 'function') {
              await registration.showNotification('MWKCN Class Fund', notificationOptions);
              return true;
            }
          }
        } catch (error) {
          console.warn('Service worker activation notification failed:', error);
        }
        if (typeof Notification === 'undefined') return false;
        try {
          var testNotification = new Notification('MWKCN Class Fund', notificationOptions);
          window.setTimeout(function () { try { testNotification.close(); } catch (ignore) {} }, 7000);
          return true;
        } catch (error) {
          console.warn('Local activation notification failed:', error);
          return false;
        }
      }
      function publishNotificationState(message, isError) {
        if (!appFrame || !appFrame.contentWindow) return;
        var enabled = oneSignalIsEnabled();
        var permission = browserNotificationPermission();
        var state = {
          type: 'mwkcn:notification-state',
          enabled: enabled,
          ready: oneSignalReady,
          authenticated: Boolean(currentStudentId),
          permission: permission,
          busy: notificationBusy,
          error: Boolean(isError),
          message: message || (enabled ? 'เปิดรับการแจ้งเตือนแล้ว' : (!currentStudentId ? 'กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน' : (!oneSignalReady ? 'กำลังเตรียมระบบแจ้งเตือน กรุณารอสักครู่' : 'ขณะนี้ยังไม่ได้เปิดรับการแจ้งเตือน')))
        };
        appFrame.contentWindow.postMessage(state, '*');
      }
      async function setNotificationOptIn(enabled) {
        if (notificationBusy) return;
        if (!currentStudentId) {
          publishNotificationState('กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน', true);
          return;
        }
        if (!oneSignalReady || !window.OneSignal) {
          publishNotificationState('ระบบแจ้งเตือนยังโหลดไม่เสร็จ กรุณารอสักครู่', true);
          return;
        }
        notificationBusy = true;
        var finalMessage = '';
        var finalError = false;
        publishNotificationState(enabled ? 'กำลังขออนุญาตเปิดการแจ้งเตือน...' : 'กำลังปิดการแจ้งเตือน...');
        try {
          var pushSubscription = window.OneSignal.User && window.OneSignal.User.PushSubscription;
          if (enabled) {
            await window.OneSignal.Notifications.requestPermission();
            if (browserNotificationPermission() === 'denied') {
              throw new Error('เบราว์เซอร์ปิดกั้นการแจ้งเตือน กรุณาอนุญาตจากการตั้งค่าเว็บไซต์');
            }
            if (pushSubscription && typeof pushSubscription.optIn === 'function') {
              await pushSubscription.optIn();
            }
            var enabledAfterOptIn = await waitForNotificationState(true, 8000);
            if (!enabledAfterOptIn) {
              throw new Error('ยังเปิดการแจ้งเตือนไม่สำเร็จ กรุณาตรวจสอบสิทธิ์แจ้งเตือนของเว็บไซต์แล้วลองใหม่');
            }
            var notificationShown = await sendActivationTestNotification();
            if (!notificationShown) {
              throw new Error('ได้รับอนุญาตแล้ว แต่ระบบปฏิบัติการไม่แสดงการแจ้งเตือนทดสอบ');
            }
            finalMessage = 'เปิดรับการแจ้งเตือนแล้ว และส่งการแจ้งเตือนทดสอบไปยังอุปกรณ์แล้ว';
          } else {
            if (pushSubscription && typeof pushSubscription.optOut === 'function') {
              await pushSubscription.optOut();
            }
            await waitForNotificationState(false, 4000);
            finalMessage = 'ปิดรับการแจ้งเตือนแล้ว';
          }
        } catch (error) {
          finalMessage = error && error.message ? error.message : 'ไม่สามารถเปลี่ยนสถานะการแจ้งเตือนได้';
          finalError = true;
        } finally {
          notificationBusy = false;
          publishNotificationState(finalMessage, finalError);
        }
      }
      async function restoreNotificationSubscription() {
        if (!oneSignalReady || !window.OneSignal || browserNotificationPermission() !== 'granted') return false;
        try {
          var subscription = window.OneSignal.User && window.OneSignal.User.PushSubscription;
          if (subscription && subscription.optedIn !== true && typeof subscription.optIn === 'function') {
            await subscription.optIn();
            await waitForNotificationState(true, 8000);
          }
          return oneSignalIsEnabled();
        } catch (error) {
          console.warn('OneSignal subscription restore failed:', error);
          return false;
        }
      }
      async function identifyOneSignalUser(studentId) {
        const cleanId = cleanStudentId(studentId);
        if (!cleanId) return false;
        currentStudentId = cleanId;
        try {
          if (oneSignalReady && window.OneSignal && window.OneSignal.login) {
            await window.OneSignal.login(cleanId);
            await restoreNotificationSubscription();
          }
          if (oneSignalIsEnabled()) {
            publishNotificationState('เปิดรับการแจ้งเตือนอยู่แล้ว');
          } else if (browserNotificationPermission() === 'denied') {
            publishNotificationState('เบราว์เซอร์ปิดกั้นการแจ้งเตือน กรุณาอนุญาตในการตั้งค่าเว็บไซต์', true);
          } else {
            publishNotificationState('กดเพื่อเปิดการแจ้งเตือน');
          }
          return true;
        } catch (error) {
          console.warn('OneSignal user identification failed:', error);
          publishNotificationState('เชื่อมบัญชีแจ้งเตือนไม่สำเร็จ กรุณากดปุ่มเพื่อลองใหม่', true);
          return false;
        }
      }
      function askFrameForStudentId() {
        try {
          if (appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage({ type: 'mwkcn:request-student-id' }, WRAPPER_ORIGIN);
          }
        } catch (error) {
          console.warn('Unable to request student ID from Apps Script frame:', error);
        }
      }
      window.addEventListener('message', function (event) {
        if (!allowedFrameOrigins.has(event.origin)) return;
        if (!event.data) return;
        if (event.source !== appFrame.contentWindow) return;
        if (event.data.type === 'mwkcn:student-identified') {
          identifyOneSignalUser(event.data.studentId);
          return;
        }
        if (event.data.type === 'mwkcn:student-logged-out') {
          currentStudentId = '';
          if (oneSignalReady && window.OneSignal?.logout) {
            window.OneSignal.logout().catch(function (error) {
              console.warn('OneSignal logout failed:', error);
            });
          }
          publishNotificationState('กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน', true);
          return;
        }
        if (event.data.type === 'mwkcn:request-notification-state') {
          publishNotificationState();
          return;
        }
        if (event.data.type === 'mwkcn:toggle-notification') {
          if (Boolean(event.data.enabled)) {
            setNotificationOptIn(true);
          } else {
            setNotificationOptIn(false);
          }
        }
      });
      if (appFrame) appFrame.addEventListener('load', function () { window.setTimeout(askFrameForStudentId, 250); window.setTimeout(askFrameForStudentId, 1500); });
      window.setInterval(function () { if (!currentStudentId) askFrameForStudentId(); }, 5000);
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OneSignal) {
        try {
          await OneSignal.init({
            appId: APP_ID,
            serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
            serviceWorkerParam: { scope: '/mwkcn-class-fund/push/onesignal/' },
            notifyButton: { enable: false }
          });
          oneSignalReady = true;
          if (currentStudentId) await identifyOneSignalUser(currentStudentId);
          askFrameForStudentId();
          publishNotificationState();
        } catch (error) {
          console.warn('OneSignal initialization failed:', error);
          publishNotificationState('ระบบแจ้งเตือนโหลดไม่สำเร็จ กรุณารีเฟรชหน้า', true);
        }
      });
    })();
  </script>
  <script>
    (function loadAppsScriptPageInsideWrapper() {
      const appFrame = document.getElementById('appFrame');
      const appUrl = new URL('https://script.google.com/macros/s/AKfycbyP5P3eZYr0BF4LacWmkO2mOahm9Go4uuAnk8bTu97f7r7jdwQUEOttJqQUyRtQQKAX/exec');
      const wrapperParams = new URLSearchParams(window.location.search);
      // ส่งต่อเฉพาะพารามิเตอร์หน้าที่จำเป็น เพื่อให้ลิงก์ studentViolation เปลี่ยนตามบัญชีที่ล็อกอิน
      ['page', 'id'].forEach(function (key) {
        if (wrapperParams.has(key)) {
          appUrl.searchParams.set(key, wrapperParams.get(key));
        }
      });
      appFrame.src = appUrl.toString();
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' })
          .catch(function (error) {
            console.warn('PWA service worker registration failed:', error);
          });
      });
    }
  </script>
  <script id="mwkcn-sound-bridge">
    (function initMwkcnSoundBridge() {
      const SOUND_KEY = 'MWKCN_SOUND_EFFECTS_ENABLED';
      const soundFiles = {
        click: './sounds/click.mp3',
        notification: './sounds/notification-pop.mp3',
        success: './sounds/task-done.mp3',
        error: './sounds/error-soft.mp3',
        reward: './sounds/badge-unlock.mp3'
      };
      const allowedOrigins = new Set(['https://script.google.com', 'https://script.googleusercontent.com']);
      let soundEnabled = localStorage.getItem(SOUND_KEY) === 'true';
      function publish() { if (appFrame && appFrame.contentWindow) appFrame.contentWindow.postMessage({ type:'mwkcn:sound-state', enabled:soundEnabled }, '*'); }
      function play(name) {
        if (!soundEnabled || !soundFiles[name]) return;
        try {
          const audio = new Audio(soundFiles[name]);
          audio.volume = name === 'click' ? 0.18 : 0.32;
          const promise = audio.play();
          if (promise && typeof promise.catch === 'function') promise.catch(() => {});
        } catch (error) { console.warn('MWKCN sound playback failed:', error); }
      }
      const appFrame = document.getElementById('appFrame');
      window.addEventListener('message', function(event) {
        if (!allowedOrigins.has(event.origin) || !event.data) return;
        if (event.data.type === 'mwkcn:request-sound-state') { publish(); return; }
        if (event.data.type === 'mwkcn:toggle-sound') { soundEnabled = Boolean(event.data.enabled); localStorage.setItem(SOUND_KEY, String(soundEnabled)); publish(); return; }
        if (event.data.type === 'mwkcn:play-sound') { play(String(event.data.sound || '')); }
      });
      if (appFrame) appFrame.addEventListener('load', publish);
    })();
  </script>

  <script id="mwkcn-google-login-wrapper">
  (function () {
    'use strict';
    var CLIENT_ID = '124359726395-e8fq3st6gakf25at9mvkb1jlbfbp7dfl.apps.googleusercontent.com';
    var frame = document.getElementById('appFrame');
    var frameOrigins = new Set(['https://script.google.com', 'https://script.googleusercontent.com']);
    var credential = '';
    var state = 'google';
    var lastMessage = null;
    var bridgeReady = false;
    var authTimer = null;

    var gate = document.createElement('section');
    gate.id = 'mwkcnAuthGate';
    gate.innerHTML = `
      <div class="mwkcn-auth-shell">
        <div class="mwkcn-auth-brand"><img class="mwkcn-auth-mark" src="./icons/icon-192.png" alt="MWKCN"><div><strong>MWKCN</strong><small>CLASS FUND SYSTEM</small></div></div>
        <div class="mwkcn-auth-card">
          <div class="mwkcn-auth-hero"><span class="mwkcn-auth-orb">✦</span><h1 id="mwkcnAuthTitle">เข้าสู่ระบบด้วย Google</h1><p id="mwkcnAuthSubtitle">ยืนยันบัญชีของคุณก่อนเข้าสู่ระบบกองทุนห้องเรียน</p></div>
          <div id="mwkcnGoogleStep"><div id="mwkcnGoogleSignInButton"></div><p id="mwkcnGoogleMessage" class="mwkcn-auth-message"></p><p class="mwkcn-auth-note">ใช้บัญชี Google เดิมในครั้งถัดไป ระบบจะเข้าสู่เว็บไซต์ให้อัตโนมัติ</p></div>
          <form id="mwkcnStudentStep" hidden><label for="mwkcnStudentNo">เลขนักเรียน</label><div class="mwkcn-student-field"><input id="mwkcnStudentNo" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="กรอกเลข 5 หลัก" required><span>/ 5</span></div><button type="submit" class="mwkcn-auth-submit">ยืนยันและเข้าสู่เว็บไซต์ <span>→</span></button><p id="mwkcnStudentMessage" class="mwkcn-auth-message"></p></form>
          <div class="mwkcn-auth-loading" id="mwkcnAuthLoading" hidden><span></span>กำลังตรวจสอบบัญชี Google...</div>
        </div>
        <p class="mwkcn-auth-footer">ระบบข้อมูลกองทุนห้องเรียน MWKCN</p>
      </div>`;
    document.body.appendChild(gate);

    function setState(next, message) {
      state = next;
      var googleStep=document.getElementById('mwkcnGoogleStep');
      var studentStep=document.getElementById('mwkcnStudentStep');
      var loading=document.getElementById('mwkcnAuthLoading');
      var title=document.getElementById('mwkcnAuthTitle');
      var subtitle=document.getElementById('mwkcnAuthSubtitle');
      var msg=document.getElementById('mwkcnStudentMessage');
      googleStep.hidden=next!=='google';
      studentStep.hidden=next!=='student';
      loading.hidden=next!=='loading';
      if(next==='google'){ title.textContent='เข้าสู่ระบบด้วย Google'; subtitle.textContent='ยืนยันบัญชีของคุณก่อนเข้าสู่ระบบกองทุนห้องเรียน'; }
      if(next==='student'){ title.textContent='กรอกเลขนักเรียน'; subtitle.textContent='บัญชี Google ยืนยันแล้ว กรุณาผูกกับเลขนักเรียนของคุณ'; setTimeout(function(){ document.getElementById('mwkcnStudentNo').focus(); },50); }
      if(msg) msg.textContent=next==='student' ? (message||'') : '';
      var gmsg=document.getElementById('mwkcnGoogleMessage');
      if(gmsg) gmsg.textContent=next==='google' ? (message||'') : '';
    }
    function showApp(){ gate.classList.add('is-complete'); frame.style.visibility='visible'; gate.setAttribute('aria-hidden','true'); }
    function showGate(){ frame.style.visibility='hidden'; gate.classList.remove('is-complete'); gate.removeAttribute('aria-hidden'); setState('google'); }
    function send(data){ lastMessage=data; if(bridgeReady && frame && frame.contentWindow) frame.contentWindow.postMessage(data,'*'); }
    if(frame) frame.addEventListener('load',function(){ setTimeout(function(){ if(lastMessage && bridgeReady) frame.contentWindow.postMessage(lastMessage,'*'); },250); });
    function onCredential(response){
      credential=response && response.credential ? response.credential : '';
      if(!credential) return;
      setState('loading');
      if(authTimer) clearTimeout(authTimer);
      authTimer=setTimeout(function(){ setState('google','ตรวจสอบนานเกินไป กรุณากดปุ่ม Google แล้วลองใหม่'); },20000);
      send({type:'mwkcn:google-credential',credential:credential});
    }
    function initGoogle(){
      if(!window.google || !google.accounts || !google.accounts.id){ setTimeout(initGoogle,300); return; }
      google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,auto_select:true,cancel_on_tap_outside:false});
      google.accounts.id.renderButton(document.getElementById('mwkcnGoogleSignInButton'),{theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:280});
      google.accounts.id.prompt();
    }
    document.getElementById('mwkcnStudentStep').addEventListener('submit',function(event){
      event.preventDefault();
      var input=document.getElementById('mwkcnStudentNo');
      var id=String(input.value||'').replace(/\D/g,'');
      if(!/^\d{5}$/.test(id)){ document.getElementById('mwkcnStudentMessage').textContent='กรุณากรอกเลขนักเรียนเป็นตัวเลข 5 หลัก'; input.focus(); return; }
      setState('loading');
      if(authTimer) clearTimeout(authTimer);
      authTimer=setTimeout(function(){ setState('student','ระบบตอบกลับช้า กรุณาลองกดยืนยันอีกครั้ง'); },20000);
      send({type:'mwkcn:google-credential',credential:credential,studentNo:id});
    });
    document.getElementById('mwkcnStudentNo').addEventListener('input',function(){ this.value=this.value.replace(/\D/g,'').slice(0,5); });
    window.addEventListener('message',function(event){
      if(!frame || event.source!==frame.contentWindow || !frameOrigins.has(event.origin) || !event.data) return;
      if(event.data.type==='mwkcn:google-bridge-ready'){ bridgeReady=true; if(lastMessage) frame.contentWindow.postMessage(lastMessage,'*'); }
      if(event.data.type==='mwkcn:need-student-number'){ if(authTimer) clearTimeout(authTimer); setState('student'); }
      if(event.data.type==='mwkcn:google-auth-error'){ if(authTimer) clearTimeout(authTimer); setState('google',event.data.message||'ตรวจสอบ Google ไม่สำเร็จ'); }
      if(event.data.type==='mwkcn:student-identified'){ if(authTimer) clearTimeout(authTimer); showApp(); }
      if(event.data.type==='mwkcn:student-logged-out'){ credential=''; google.accounts.id.disableAutoSelect(); showGate(); }
    });
    showGate();
    window.addEventListener('load',initGoogle);
    if(document.readyState!=='loading') initGoogle();
  })();
  </script>

</body>
</html>
