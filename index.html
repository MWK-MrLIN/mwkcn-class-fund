<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base target="_top">
  <title>MWKCN Class Fund</title>

  <!-- PWA: ชื่อแอปและไอคอนจริงจากโลโก้ MWKCN -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <meta name="theme-color" content="#1769e0">
  <meta name="apple-mobile-web-app-title" content="MWKCN Class Fund">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- OneSignal Web Push SDK: ใช้ App ID สาธารณะเท่านั้น -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #f3f6fb;
    }

    iframe {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
    }

    #notificationPermissionButton {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 20;
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 14px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: #1769e0;
      box-shadow: 0 10px 24px rgba(23, 105, 224, .28);
      font: 700 14px Sarabun, sans-serif;
      cursor: pointer;
    }

    #notificationPermissionButton.is-ready {
      display: inline-flex;
    }

    #notificationPermissionButton:disabled {
      opacity: .65;
      cursor: wait;
    }

    @media (max-width: 480px) {
      #notificationPermissionButton {
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        min-height: 40px;
        padding-inline: 12px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    src="about:blank"
    title="MWKCN Class Fund"
    loading="eager"
    allow="fullscreen">
  </iframe>

  <button id="notificationPermissionButton" type="button" aria-label="เปิดการแจ้งเตือน">
    <span aria-hidden="true">🔔</span>
    <span>เปิดการแจ้งเตือน</span>
  </button>

  <script>
    (function initMwkcnOneSignal() {
      const appFrame = document.getElementById('appFrame');
      const APP_ID = 'b9217e22-0f2e-41bc-821a-df4de8fd7035';
      const WRAPPER_ORIGIN = window.location.origin;
      const allowedFrameOrigins = new Set([
        'https://script.google.com',
        'https://script.googleusercontent.com'
      ]);
      const button = document.getElementById('notificationPermissionButton');
      let currentStudentId = '';
      let oneSignalReady = false;
      let notificationBusy = false;

      function cleanStudentId(value) {
        const normalized = String(value == null ? '' : value).trim();
        return /^[A-Za-z0-9_-]{3,64}$/.test(normalized) ? normalized : '';
      }

      function setButtonState(text, visible, disabled) {
        if (!button) return;
        button.querySelector('span:last-child').textContent = text;
        button.classList.toggle('is-ready', Boolean(visible));
        button.disabled = Boolean(disabled);
      }

      function browserNotificationPermission() {
        return typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
      }

      function oneSignalIsEnabled() {
        try {
          return Boolean(window.OneSignal && window.OneSignal.User && window.OneSignal.User.PushSubscription && window.OneSignal.User.PushSubscription.optedIn);
        } catch (error) {
          return false;
        }
      }

      function publishNotificationState(message, isError) {
        if (!appFrame || !appFrame.contentWindow) return;
        var enabled = oneSignalIsEnabled();
        var permission = browserNotificationPermission();
        var state = {
          type: 'mwkcn:notification-state',
          enabled: enabled,
          ready: oneSignalReady,
          authenticated: Boolean(currentStudentId),
          permission: permission,
          busy: notificationBusy,
          error: Boolean(isError),
          message: message || (enabled ? 'เปิดรับการแจ้งเตือนแล้ว' : (!currentStudentId ? 'กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน' : (!oneSignalReady ? 'กำลังเตรียมระบบแจ้งเตือน กรุณารอสักครู่' : 'ขณะนี้ยังไม่ได้เปิดรับการแจ้งเตือน')))
        };
        appFrame.contentWindow.postMessage(state, '*');
      }

      async function setNotificationOptIn(enabled) {
        if (notificationBusy) return;
        if (!currentStudentId) {
          publishNotificationState('กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน', true);
          return;
        }
        if (!oneSignalReady || !window.OneSignal) {
          publishNotificationState('ระบบแจ้งเตือนยังโหลดไม่เสร็จ กรุณารอสักครู่', true);
          return;
        }
        notificationBusy = true;
        publishNotificationState(enabled ? 'กำลังขออนุญาตเปิดการแจ้งเตือน...' : 'กำลังปิดการแจ้งเตือน...');
        try {
          var pushSubscription = window.OneSignal.User && window.OneSignal.User.PushSubscription;
          if (enabled) {
            await window.OneSignal.Notifications.requestPermission();
            if (browserNotificationPermission() === 'denied') {
              throw new Error('เบราว์เซอร์ปิดกั้นการแจ้งเตือน กรุณาอนุญาตจากการตั้งค่าเว็บไซต์');
            }
            if (pushSubscription && typeof pushSubscription.optIn === 'function') {
              await pushSubscription.optIn();
            }
          } else if (pushSubscription && typeof pushSubscription.optOut === 'function') {
            await pushSubscription.optOut();
          }
          publishNotificationState(enabled ? 'เปิดรับการแจ้งเตือนแล้ว' : 'ปิดรับการแจ้งเตือนแล้ว');
        } catch (error) {
          publishNotificationState(error && error.message ? error.message : 'ไม่สามารถเปลี่ยนสถานะการแจ้งเตือนได้', true);
        } finally {
          notificationBusy = false;
          publishNotificationState();
        }
      }

      async function identifyOneSignalUser(studentId) {
        const cleanId = cleanStudentId(studentId);
        if (!cleanId) return false;
        currentStudentId = cleanId;
        try {
          if (oneSignalReady && window.OneSignal && window.OneSignal.login) {
            await window.OneSignal.login(cleanId);
          }
          setButtonState('เปิดการแจ้งเตือน', true, false);
          publishNotificationState();
          return true;
        } catch (error) {
          console.warn('OneSignal user identification failed:', error);
          setButtonState('เปิดการแจ้งเตือน', true, false);
          publishNotificationState('เชื่อมบัญชีแจ้งเตือนไม่สำเร็จ กรุณาลองใหม่', true);
          return false;
        }
      }

      function askFrameForStudentId() {
        try {
          if (appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage({ type: 'mwkcn:request-student-id' }, '*');
          }
        } catch (error) {
          console.warn('Unable to request student ID from Apps Script frame:', error);
        }
      }

      window.addEventListener('message', function (event) {
        if (!allowedFrameOrigins.has(event.origin)) return;
        if (!event.data) return;
        if (event.data.type === 'mwkcn:student-identified') {
          identifyOneSignalUser(event.data.studentId);
          return;
        }
        if (event.data.type === 'mwkcn:student-logged-out') {
          currentStudentId = '';
          if (oneSignalReady && window.OneSignal?.logout) {
            window.OneSignal.logout().catch(function (error) {
              console.warn('OneSignal logout failed:', error);
            });
          }
          setButtonState('เข้าสู่ระบบก่อนเปิดแจ้งเตือน', false, false);
          publishNotificationState('กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน', true);
          return;
        }
        if (event.data.type === 'mwkcn:request-notification-state') {
          publishNotificationState();
          return;
        }
        if (event.data.type === 'mwkcn:toggle-notification') {
          setNotificationOptIn(Boolean(event.data.enabled));
        }
      });

      button?.addEventListener('click', async function () {
        if (!currentStudentId) {
          setButtonState('กรุณาเข้าสู่ระบบก่อน', true, false);
          askFrameForStudentId();
          return;
        }
        if (!oneSignalReady || !window.OneSignal) {
          setButtonState('กำลังเตรียมระบบ...', true, true);
          return;
        }
        button.disabled = true;
        try {
          await window.OneSignal.Notifications.requestPermission();
          if (window.OneSignal.User?.PushSubscription?.optIn) {
            await window.OneSignal.User.PushSubscription.optIn();
          }
          setButtonState('เปิดแจ้งเตือนแล้ว', true, true);
        } catch (error) {
          console.warn('OneSignal permission request failed:', error);
          setButtonState('เปิดการแจ้งเตือน', true, false);
        }
      });

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OneSignal) {
        try {
          await OneSignal.init({
            appId: APP_ID,
            serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
            serviceWorkerParam: { scope: '/mwkcn-class-fund/push/onesignal/' },
            notifyButton: { enable: false }
          });
          oneSignalReady = true;
          if (currentStudentId) await identifyOneSignalUser(currentStudentId);
          askFrameForStudentId();
          setButtonState('เปิดการแจ้งเตือน', Boolean(currentStudentId), false);
          publishNotificationState();
        } catch (error) {
          console.warn('OneSignal initialization failed:', error);
          setButtonState('เปิดการแจ้งเตือน', Boolean(currentStudentId), false);
          publishNotificationState('ระบบแจ้งเตือนโหลดไม่สำเร็จ กรุณารีเฟรชหน้า', true);
        }
      });
    })();
  </script>

  <script>
    (function loadAppsScriptPageInsideWrapper() {
      const appFrame = document.getElementById('appFrame');
      const appUrl = new URL('https://script.google.com/macros/s/AKfycbyP5P3eZYr0BF4LacWmkO2mOahm9Go4uuAnk8bTu97f7r7jdwQUEOttJqQUyRtQQKAX/exec');
      const wrapperParams = new URLSearchParams(window.location.search);

      // ส่งต่อเฉพาะพารามิเตอร์หน้าที่จำเป็น เพื่อให้ลิงก์ studentViolation เปลี่ยนตามบัญชีที่ล็อกอิน
      ['page', 'id'].forEach(function (key) {
        if (wrapperParams.has(key)) {
          appUrl.searchParams.set(key, wrapperParams.get(key));
        }
      });

      appFrame.src = appUrl.toString();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' })
          .catch(function (error) {
            console.warn('PWA service worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
