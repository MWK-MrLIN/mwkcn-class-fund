  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #f3f6fb;
    }

    iframe {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
    }


    #mwkcnGoogleLoginGate { position:fixed; inset:0; z-index:100000; display:grid; place-items:center; padding:20px; background:rgba(243,246,251,.96); backdrop-filter:blur(10px); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#142033; }
    #mwkcnGoogleLoginGate[hidden] { display:none; }
    .mwkcn-login-card { width:min(100%,420px); padding:30px 26px; border:1px solid #e4eaf2; border-radius:24px; background:#fff; box-shadow:0 24px 70px rgba(34,61,102,.16); text-align:center; }
    .mwkcn-login-card h1 { margin:0 0 8px; font-size:1.45rem; }
    .mwkcn-login-card p { color:#657286; line-height:1.55; margin:8px 0 18px; }
    #mwkcnGoogleButton { display:flex; justify-content:center; min-height:44px; margin:14px auto; }
    #mwkcnGoogleEmail { color:#1769e0; font-weight:700; overflow-wrap:anywhere; }
    #mwkcnStudentStep[hidden] { display:none; }
    #mwkcnStudentNo { width:100%; height:48px; border:1px solid #dbe3ef; border-radius:12px; padding:0 14px; font-size:1rem; letter-spacing:.12em; text-align:center; }
    #mwkcnBindButton { width:100%; margin-top:12px; padding:13px; border:0; border-radius:12px; background:#1769e0; color:white; font-weight:700; font-size:1rem; cursor:pointer; }

<body>
  <iframe
    id="appFrame"
    src="about:blank"
    title="MWKCN Class Fund"
    loading="eager"
    allow="fullscreen; notifications">
  </iframe>

  <div id="mwkcnGoogleLoginGate" role="dialog" aria-modal="true" aria-labelledby="mwkcnLoginTitle">
    <main class="mwkcn-login-card">
      <h1 id="mwkcnLoginTitle">เข้าสู่ระบบนักเรียน</h1>
      <p>เข้าสู่ระบบด้วยบัญชี Gmail ส่วนตัว จากนั้นกรอกเลขประจำตัวนักเรียนเพื่อเชื่อมบัญชีครั้งแรก</p>
      <div id="mwkcnGoogleButton"></div>
      <div id="mwkcnStudentStep" hidden>
        <p>บัญชีที่เลือก: <span id="mwkcnGoogleEmail"></span></p>
        <label for="mwkcnStudentNo">เลขประจำตัวนักเรียน (5 หลัก)</label>
        <input id="mwkcnStudentNo" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="กรอกเลขประจำตัว">
        <button id="mwkcnBindButton" type="button">เชื่อมบัญชีและเข้าสู่ระบบ</button>
      </div>
      <div id="mwkcnLoginStatus" aria-live="polite">กำลังเตรียมระบบเข้าสู่ระบบ...</div>
      <p class="mwkcn-login-note">การกรอกเลขประจำตัวเพียงอย่างเดียวเป็นการยืนยันตัวตนระดับพื้นฐาน ผู้ที่ทราบเลขอาจผูกบัญชีแทนได้</p>
    </main>
  </div>



  <script>
    (function initMwkcnOneSignal() {
      const appFrame = document.getElementById('appFrame');
      const APP_ID = 'b9217e22-0f2e-41bc-821a-df4de8fd7035';
      const WRAPPER_ORIGIN = window.location.origin;
      const allowedFrameOrigins = new Set([
        'https://script.google.com',
        'https://script.googleusercontent.com'
      ]);
      let currentStudentId = '';
      let oneSignalReady = false;
      let notificationBusy = false;

      function cleanStudentId(value) {
        const normalized = String(value == null ? '' : value).trim();
        return /^[A-Za-z0-9_-]{3,64}$/.test(normalized) ? normalized : '';
      }

      function browserNotificationPermission() {
        return typeof Notification === 'undefined' ? 'unsupported' : Notification.permission;
      }

      function oneSignalIsEnabled() {
        try {
          var subscription = window.OneSignal && window.OneSignal.User && window.OneSignal.User.PushSubscription;
          return Boolean(subscription && subscription.optedIn === true);
        } catch (error) {
          return false;
        }
      }

      function waitForNotificationState(expected, timeoutMs) {
        var startedAt = Date.now();
        return new Promise(function (resolve) {
          function check() {
            var enabled = oneSignalIsEnabled();
            if (enabled === expected || Date.now() - startedAt >= timeoutMs) {
              resolve(enabled);
              return;
            }
            window.setTimeout(check, 250);
          }
          check();
        });
      }

      async function sendActivationTestNotification() {
        if (browserNotificationPermission() !== 'granted') return false;
        var notificationOptions = {
          body: 'เปิดใช้งานการแจ้งเตือนแล้ว',
          icon: './icons/icon-192.png',
          tag: 'mwkcn-notification-enabled',
          renotify: true
        };
        try {
          if ('serviceWorker' in navigator) {
            var registration = await navigator.serviceWorker.ready;
            if (registration && typeof registration.showNotification === 'function') {
              await registration.showNotification('MWKCN Class Fund', notificationOptions);
              return true;
            }
          }
        } catch (error) {
          console.warn('Service worker activation notification failed:', error);
        }
        if (typeof Notification === 'undefined') return false;
        try {
          var testNotification = new Notification('MWKCN Class Fund', notificationOptions);
          window.setTimeout(function () { try { testNotification.close(); } catch (ignore) {} }, 7000);
          return true;
        } catch (error) {
          console.warn('Local activation notification failed:', error);
          return false;
        }
      }

      function publishNotificationState(message, isError) {
        if (!appFrame || !appFrame.contentWindow) return;
        var enabled = oneSignalIsEnabled();
        var permission = browserNotificationPermission();
        var state = {
          type: 'mwkcn:notification-state',
          enabled: enabled,
          ready: oneSignalReady,
          authenticated: Boolean(currentStudentId),
          permission: permission,
          busy: notificationBusy,
          error: Boolean(isError),
          message: message || (enabled ? 'เปิดรับการแจ้งเตือนแล้ว' : (!currentStudentId ? 'กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน' : (!oneSignalReady ? 'กำลังเตรียมระบบแจ้งเตือน กรุณารอสักครู่' : 'ขณะนี้ยังไม่ได้เปิดรับการแจ้งเตือน')))
        };
        appFrame.contentWindow.postMessage(state, '*');
      }

      async function setNotificationOptIn(enabled) {
        if (notificationBusy) return;
        if (!currentStudentId) {
          publishNotificationState('กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน', true);
          return;
        }
        if (!oneSignalReady || !window.OneSignal) {
          publishNotificationState('ระบบแจ้งเตือนยังโหลดไม่เสร็จ กรุณารอสักครู่', true);
          return;
        }
        notificationBusy = true;
        var finalMessage = '';
        var finalError = false;
        publishNotificationState(enabled ? 'กำลังขออนุญาตเปิดการแจ้งเตือน...' : 'กำลังปิดการแจ้งเตือน...');
        try {
          var pushSubscription = window.OneSignal.User && window.OneSignal.User.PushSubscription;
          if (enabled) {
            await window.OneSignal.Notifications.requestPermission();
            if (browserNotificationPermission() === 'denied') {
              throw new Error('เบราว์เซอร์ปิดกั้นการแจ้งเตือน กรุณาอนุญาตจากการตั้งค่าเว็บไซต์');
            }
            if (pushSubscription && typeof pushSubscription.optIn === 'function') {
              await pushSubscription.optIn();
            }
            var enabledAfterOptIn = await waitForNotificationState(true, 8000);
            if (!enabledAfterOptIn) {
              throw new Error('ยังเปิดการแจ้งเตือนไม่สำเร็จ กรุณาตรวจสอบสิทธิ์แจ้งเตือนของเว็บไซต์แล้วลองใหม่');
            }
            var notificationShown = await sendActivationTestNotification();
            if (!notificationShown) {
              throw new Error('ได้รับอนุญาตแล้ว แต่ระบบปฏิบัติการไม่แสดงการแจ้งเตือนทดสอบ');
            }
            finalMessage = 'เปิดรับการแจ้งเตือนแล้ว และส่งการแจ้งเตือนทดสอบไปยังอุปกรณ์แล้ว';
          } else {
            if (pushSubscription && typeof pushSubscription.optOut === 'function') {
              await pushSubscription.optOut();
            }
            await waitForNotificationState(false, 4000);
            finalMessage = 'ปิดรับการแจ้งเตือนแล้ว';
          }
        } catch (error) {
          finalMessage = error && error.message ? error.message : 'ไม่สามารถเปลี่ยนสถานะการแจ้งเตือนได้';
          finalError = true;
        } finally {
          notificationBusy = false;
          publishNotificationState(finalMessage, finalError);
        }
      }

      async function restoreNotificationSubscription() {
        if (!oneSignalReady || !window.OneSignal || browserNotificationPermission() !== 'granted') return false;
        try {
          var subscription = window.OneSignal.User && window.OneSignal.User.PushSubscription;
          if (subscription && subscription.optedIn !== true && typeof subscription.optIn === 'function') {
            await subscription.optIn();
            await waitForNotificationState(true, 8000);
          }
          return oneSignalIsEnabled();
        } catch (error) {
          console.warn('OneSignal subscription restore failed:', error);
          return false;
        }
      }

      async function identifyOneSignalUser(studentId) {
        const cleanId = cleanStudentId(studentId);
        if (!cleanId) return false;
        currentStudentId = cleanId;
        try {
          if (oneSignalReady && window.OneSignal && window.OneSignal.login) {
            await window.OneSignal.login(cleanId);
            await restoreNotificationSubscription();
          }
          if (oneSignalIsEnabled()) {
            publishNotificationState('เปิดรับการแจ้งเตือนอยู่แล้ว');
          } else if (browserNotificationPermission() === 'denied') {
            publishNotificationState('เบราว์เซอร์ปิดกั้นการแจ้งเตือน กรุณาอนุญาตในการตั้งค่าเว็บไซต์', true);
          } else {
            publishNotificationState('กดเพื่อเปิดการแจ้งเตือน');
          }
          return true;
        } catch (error) {
          console.warn('OneSignal user identification failed:', error);
          publishNotificationState('เชื่อมบัญชีแจ้งเตือนไม่สำเร็จ กรุณากดปุ่มเพื่อลองใหม่', true);
          return false;
        }
      }

      function askFrameForStudentId() {
        try {
          if (appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage({ type: 'mwkcn:request-student-id' }, WRAPPER_ORIGIN);
          }
        } catch (error) {
          console.warn('Unable to request student ID from Apps Script frame:', error);
        }
      }

      window.addEventListener('message', function (event) {
        if (!allowedFrameOrigins.has(event.origin)) return;
        if (!event.data) return;
        if (event.source !== appFrame.contentWindow) return;
        if (event.data.type === 'mwkcn:student-identified') {
          identifyOneSignalUser(event.data.studentId);
          return;
        }
        if (event.data.type === 'mwkcn:student-logged-out') {
          currentStudentId = '';
          if (oneSignalReady && window.OneSignal?.logout) {
            window.OneSignal.logout().catch(function (error) {
              console.warn('OneSignal logout failed:', error);
            });
          }
          publishNotificationState('กรุณาเข้าสู่ระบบก่อนเปิดการแจ้งเตือน', true);
          return;
        }
        if (event.data.type === 'mwkcn:request-notification-state') {
          publishNotificationState();
          return;
        }
        if (event.data.type === 'mwkcn:toggle-notification') {
          if (Boolean(event.data.enabled)) {
            setNotificationOptIn(true);
          } else {
            setNotificationOptIn(false);
          }
        }
      });

      if (appFrame) appFrame.addEventListener('load', function () { window.setTimeout(askFrameForStudentId, 250); window.setTimeout(askFrameForStudentId, 1500); });
      window.setInterval(function () { if (!currentStudentId) askFrameForStudentId(); }, 5000);

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OneSignal) {
        try {
          await OneSignal.init({
            appId: APP_ID,
            serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
            serviceWorkerParam: { scope: '/mwkcn-class-fund/push/onesignal/' },
            notifyButton: { enable: false }
          });
          oneSignalReady = true;
          if (currentStudentId) await identifyOneSignalUser(currentStudentId);
          askFrameForStudentId();
          publishNotificationState();
        } catch (error) {
          console.warn('OneSignal initialization failed:', error);
          publishNotificationState('ระบบแจ้งเตือนโหลดไม่สำเร็จ กรุณารีเฟรชหน้า', true);
        }
      });
    })();
  </script>

  <script>
    (function loadAppsScriptPageInsideWrapper() {
      const appFrame = document.getElementById('appFrame');
      const appUrl = new URL('https://script.google.com/macros/s/AKfycbyP5P3eZYr0BF4LacWmkO2mOahm9Go4uuAnk8bTu97f7r7jdwQUEOttJqQUyRtQQKAX/exec');
      const wrapperParams = new URLSearchParams(window.location.search);

      // ส่งต่อเฉพาะพารามิเตอร์หน้าที่จำเป็น เพื่อให้ลิงก์ studentViolation เปลี่ยนตามบัญชีที่ล็อกอิน
      ['page', 'id'].forEach(function (key) {
        if (wrapperParams.has(key)) {
          appUrl.searchParams.set(key, wrapperParams.get(key));
        }
      });

      appFrame.src = appUrl.toString();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' })
          .catch(function (error) {
            console.warn('PWA service worker registration failed:', error);
          });
      });
    }
  </script>

  <script id="mwkcn-sound-bridge">
    (function initMwkcnSoundBridge() {
      const SOUND_KEY = 'MWKCN_SOUND_EFFECTS_ENABLED';
      const soundFiles = {
        click: './sounds/click.mp3',
        notification: './sounds/notification-pop.mp3',
        success: './sounds/task-done.mp3',
        error: './sounds/error-soft.mp3',
        reward: './sounds/badge-unlock.mp3'
      };
      const allowedOrigins = new Set(['https://script.google.com', 'https://script.googleusercontent.com']);
      let soundEnabled = localStorage.getItem(SOUND_KEY) === 'true';
      function publish() { if (appFrame && appFrame.contentWindow) appFrame.contentWindow.postMessage({ type:'mwkcn:sound-state', enabled:soundEnabled }, '*'); }
      function play(name) {
        if (!soundEnabled || !soundFiles[name]) return;
        try {
          const audio = new Audio(soundFiles[name]);
          audio.volume = name === 'click' ? 0.18 : 0.32;
          const promise = audio.play();
          if (promise && typeof promise.catch === 'function') promise.catch(() => {});
        } catch (error) { console.warn('MWKCN sound playback failed:', error); }
      }
      const appFrame = document.getElementById('appFrame');
      window.addEventListener('message', function(event) {
        if (!allowedOrigins.has(event.origin) || !event.data) return;
        if (event.data.type === 'mwkcn:request-sound-state') { publish(); return; }
        if (event.data.type === 'mwkcn:toggle-sound') { soundEnabled = Boolean(event.data.enabled); localStorage.setItem(SOUND_KEY, String(soundEnabled)); publish(); return; }
        if (event.data.type === 'mwkcn:play-sound') { play(String(event.data.sound || '')); }
      });
      if (appFrame) appFrame.addEventListener('load', publish);
    })();
  </script>


  <script>
    (function initMwkcnGoogleStudentLogin() {
      'use strict';
      const appFrame = document.getElementById('appFrame');
      const gate = document.getElementById('mwkcnGoogleLoginGate');
      const status = document.getElementById('mwkcnLoginStatus');
      const step = document.getElementById('mwkcnStudentStep');
      const emailNode = document.getElementById('mwkcnGoogleEmail');
      const studentInput = document.getElementById('mwkcnStudentNo');
      const bindButton = document.getElementById('mwkcnBindButton');
      const STORAGE_KEY = 'MWKCN_GOOGLE_STUDENT_SESSION_V1';
      // Public OAuth Web client ID (not a secret). Replace with the ID created for your verified custom domain.
      const GOOGLE_CLIENT_ID = '124359726395-e8fq3st6gakf25at9mvkb1jlbfbp7dfl.apps.googleusercontent.com';
      const ALLOWED_FRAME_ORIGINS = new Set(['https://script.google.com', 'https://script.googleusercontent.com']);
      let appOrigin = '';
      let googleCredential = '';
      let emailForDisplay = '';
      let pendingLoginTimeout = null;
      let restoreStarted = false;

      function setStatus(message, isError) {
        if (!status) return;
        status.textContent = message || '';
        status.classList.toggle('error', Boolean(isError));
      }
      function readSavedSession() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
          if (saved && /^\d{5}$/.test(String(saved.studentId || '')) && typeof saved.email === 'string') return saved;
        } catch (error) { }
        return null;
      }
      function clearSavedSession() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (error) { }
      }
      function decodeEmail(idToken) {
        try {
          const part = String(idToken).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          const normalized = part + '='.repeat((4 - part.length % 4) % 4);
          const claims = JSON.parse(decodeURIComponent(Array.prototype.map.call(atob(normalized), c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join('')));
          return String(claims.email || '').trim().toLowerCase();
        } catch (error) { return ''; }
      }
      function hideGate() { if (gate) gate.hidden = true; }
      function showGate(message, isError) { if (gate) gate.hidden = false; setStatus(message, isError); }
      function sendToApp(message) {
        if (!appOrigin || !appFrame || !appFrame.contentWindow) return false;
        appFrame.contentWindow.postMessage(message, appOrigin);
        return true;
      }
      function requestRestore() {
        if (restoreStarted) return;
        const saved = readSavedSession();
        if (!saved) { showGate('ลงชื่อเข้าใช้ด้วย Google เพื่อดำเนินการต่อ'); return; }
        restoreStarted = true;
        showGate('กำลังเปิดบัญชีที่บันทึกไว้...');
        if (!sendToApp({ type:'mwkcn:restore-student', studentId:String(saved.studentId), email:String(saved.email || '') })) {
          setStatus('กำลังเชื่อมต่อระบบ กรุณารอสักครู่...');
          window.setTimeout(function () { restoreStarted = false; }, 3000);
        }
      }
      function onGoogleCredential(response) {
        googleCredential = String(response && response.credential || '');
        emailForDisplay = decodeEmail(googleCredential);
        if (!googleCredential || !emailForDisplay) {
          setStatus('อ่านบัญชี Google ไม่สำเร็จ กรุณาลองอีกครั้ง', true);
          return;
        }
        if (emailNode) emailNode.textContent = emailForDisplay;
        if (step) step.hidden = false;
        setStatus('กรอกเลขประจำตัวนักเรียนเพื่อเชื่อมกับบัญชีนี้');
        if (studentInput) studentInput.focus();
      }
      function renderGoogleButton(attempt) {
        if (window.google && google.accounts && google.accounts.id) {
          if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.indexOf('PASTE_') === 0) {
            setStatus('ต้องใส่ Google OAuth Web Client ID ในไฟล์นี้ก่อนใช้งาน', true);
            return;
          }
          google.accounts.id.initialize({ client_id:GOOGLE_CLIENT_ID, callback:onGoogleCredential, auto_select:false });
          google.accounts.id.renderButton(document.getElementById('mwkcnGoogleButton'), {
            type:'standard', theme:'outline', size:'large', shape:'rectangular', text:'continue_with',
            width:280, locale:'th'
          });
          setStatus('เลือกบัญชี Gmail ส่วนตัวเพื่อดำเนินการต่อ');
          return;
        }
        if (attempt < 40) window.setTimeout(function () { renderGoogleButton(attempt + 1); }, 250);
        else setStatus('โหลด Google Sign-In ไม่สำเร็จ กรุณาตรวจสอบเครือข่ายหรือการตั้งค่าเว็บไซต์', true);
      }
      function submitBinding() {
        const id = String(studentInput && studentInput.value || '').replace(/[^0-9]/g, '');
        if (!googleCredential) { setStatus('กรุณาเลือกบัญชี Google ก่อน', true); return; }
        if (!/^\d{5}$/.test(id)) { setStatus('กรุณากรอกเลขประจำตัวนักเรียนให้ครบ 5 หลัก', true); studentInput && studentInput.focus(); return; }
        if (!appOrigin) { setStatus('กำลังเชื่อมต่อระบบ กรุณาลองอีกครั้งในไม่กี่วินาที', true); return; }
        bindButton.disabled = true;
        setStatus('กำลังตรวจสอบ Google และบันทึกการเชื่อมบัญชี...');
        if (pendingLoginTimeout) window.clearTimeout(pendingLoginTimeout);
        pendingLoginTimeout = window.setTimeout(function () {
          bindButton.disabled = false;
          setStatus('ระบบใช้เวลานาน กรุณาลองใหม่อีกครั้ง', true);
        }, 30000);
        sendToApp({ type:'mwkcn:google-student-login', studentId:id, credential:googleCredential });
      }
      window.addEventListener('message', function (event) {
        if (!ALLOWED_FRAME_ORIGINS.has(event.origin) || !appFrame || event.source !== appFrame.contentWindow || !event.data) return;
        const data = event.data;
        appOrigin = event.origin;
        if (data.type === 'mwkcn:app-ready') { requestRestore(); return; }
        if (data.type === 'mwkcn:student-login-complete') {
          if (pendingLoginTimeout) window.clearTimeout(pendingLoginTimeout);
          const studentId = String(data.studentId || '').replace(/[^0-9]/g, '');
          const email = String(data.email || emailForDisplay || '').trim().toLowerCase();
          if (/^\d{5}$/.test(studentId)) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ studentId:studentId, email:email, savedAt:Date.now() })); } catch (error) { }
            hideGate();
            googleCredential = '';
            emailForDisplay = email;
            if (bindButton) bindButton.disabled = false;
          }
          return;
        }
        if (data.type === 'mwkcn:student-login-failed') {
          restoreStarted = false;
          if (pendingLoginTimeout) window.clearTimeout(pendingLoginTimeout);
          if (bindButton) bindButton.disabled = false;
          setStatus(String(data.reason || 'เข้าสู่ระบบไม่สำเร็จ'), true);
          return;
        }
        if (data.type === 'mwkcn:student-logged-out') {
          restoreStarted = false;
          clearSavedSession();
          googleCredential = '';
          emailForDisplay = '';
          if (step) step.hidden = true;
          if (studentInput) studentInput.value = '';
          if (bindButton) bindButton.disabled = false;
          showGate('ออกจากระบบแล้ว กรุณาเข้าสู่ระบบด้วย Google อีกครั้ง');
          return;
        }
      });
      if (studentInput) studentInput.addEventListener('input', function () { studentInput.value = studentInput.value.replace(/[^0-9]/g, '').slice(0, 5); });
      if (bindButton) bindButton.addEventListener('click', submitBinding);
      if (studentInput) studentInput.addEventListener('keydown', function (event) { if (event.key === 'Enter') submitBinding(); });
      if (appFrame) appFrame.addEventListener('load', function () {
        appFrame.contentWindow.postMessage({ type:'mwkcn:request-auth-state' }, '*');
      });
      showGate('กำลังเตรียมระบบเข้าสู่ระบบ...');
      renderGoogleButton(0);
    })();
  </script>
